name: Smoke test surf_ski

on:
  workflow_dispatch:
    inputs:
      script:
        description: Luau script to run in the place
        default: tests/smoke.luau
  workflow_run:
    workflows: ["Publish surf_ski"]
    types: [completed]

jobs:
  smoke:
    # Nur nach einer echten Veroeffentlichung (nicht nach Pull-Request-Builds)
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    env:
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
      SCRIPT: ${{ inputs.script || 'tests/smoke.luau' }}
    defaults:
      run:
        working-directory: games/surf
    steps:
      - uses: actions/checkout@v4

      # Fuehrt tests/smoke.luau im veroeffentlichten Place aus (Open Cloud Luau Execution)
      - name: Run smoke test
        run: |
          U=$(jq -r '.universeId' roblox.json); P=$(jq -r '.placeId' roblox.json)
          if [ -z "$U" ] || [ -z "$P" ]; then echo "::warning::IDs not pinned in roblox.json yet - skipping"; exit 0; fi
          BASE="https://apis.roblox.com/cloud/v2/universes/$U/places/$P"
          curl -sS -X POST "$BASE/luau-execution-session-tasks" -H "x-api-key: $ROBLOX_API_KEY" -H "Content-Type: application/json" \
            -d "$(jq -n --rawfile s "$SCRIPT" '{script: $s, timeout: "120s"}')" -o task.json
          TASK=$(jq -r '.path // empty' task.json)
          if [ -z "$TASK" ]; then echo "::error::create failed: $(head -c 400 task.json)"; exit 1; fi
          for i in $(seq 1 60); do
            sleep 5
            curl -sS "https://apis.roblox.com/cloud/v2/$TASK" -H "x-api-key: $ROBLOX_API_KEY" -o state.json
            STATE=$(jq -r '.state' state.json)
            [ "$STATE" = "COMPLETE" ] || [ "$STATE" = "FAILED" ] || [ "$STATE" = "CANCELLED" ] && break
          done
          echo "::notice::state: $STATE"
          if [ "$STATE" = "COMPLETE" ]; then
            jq -r '.output.results[0] // .output // empty' state.json | while IFS= read -r line; do
              case "$line" in FAIL*) echo "::error::$line";; *) echo "::notice::$line";; esac
            done
            jq -r '.output.results[0] // ""' state.json | head -1 | grep -q "^SUMMARY: 0 failed" || exit 1
          else
            echo "::error::$(jq -c '.error' state.json | head -c 600)"
            curl -sS "https://apis.roblox.com/cloud/v2/$TASK/logs" -H "x-api-key: $ROBLOX_API_KEY" | head -c 1500 | tr '\n' ' ' | sed 's/^/::notice::logs: /'
            exit 1
          fi
