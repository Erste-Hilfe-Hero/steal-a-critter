name: Maturity questionnaire

# Fuellt den Roblox "Maturity & Compliance"-Fragebogen (Altersempfehlung) fuer Alis Spiele aus.
# Creator Hub hat dafuer keine Open-Cloud-API, deshalb mit dem Login-Cookie ROBLOSECURITY (Ali: "Mach du das", 2026-11-13).
# Phase 1 (discover): sucht im Creator-Hub-Code nach den Fragebogen-Endpunkten. Der Cookie wird nie ausgegeben.

on:
  workflow_dispatch:
  push:
    branches: [claude/**]
    paths: [.github/workflows/maturity.yml]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      COOKIE: ${{ secrets.ROBLOSECURITY }}
      U: "3003317051"
    steps:
      - name: Discover endpoints
        run: |
          set +e
          mkdir -p out js
          CSRF=""
          call() { M=$1; URL=$2; shift 2
            for TRY in 1 2; do
              R=$(curl -sS -X "$M" "$URL" -H "Cookie: .ROBLOSECURITY=$COOKIE" -H "x-csrf-token: $CSRF" \
                -H 'Origin: https://create.roblox.com' -H 'Referer: https://create.roblox.com/' -D h.txt "$@" -w '\nHTTP %{http_code}')
              T=$(grep -i '^x-csrf-token:' h.txt | tr -d '\r' | awk '{print $2}'); rm -f h.txt
              if echo "$R" | grep -q 'HTTP 403' && [ -n "$T" ] && [ "$T" != "$CSRF" ]; then CSRF=$T; continue; fi
              break
            done; echo "$R"; }
          BASE=https://create.roblox.com
          for P in "/dashboard/creations/experiences/$U/questionnaire" "/dashboard/creations/experiences/$U/overview" "/dashboard/creations"; do
            curl -sSL "$BASE$P" -H "Cookie: .ROBLOSECURITY=$COOKIE" -A 'Mozilla/5.0' >> out/pages.html
          done
          grep -oE '(https://[a-z.]*roblox\.com)?/[A-Za-z0-9_./-]*\.js' out/pages.html | sort -u > out/scripts.txt
          wc -l out/scripts.txt
          # Next.js Build-Manifeste und ggf. Microfrontend-Manifeste mitnehmen
          while read -r S; do case "$S" in http*) echo "$S";; *) echo "$BASE$S";; esac; done < out/scripts.txt > out/urls.txt
          i=0; while read -r S; do i=$((i+1)); curl -sS "$S" -o js/$i.js; done < out/urls.txt
          # weitere Chunks aus geladenen JS-Dateien (Pfade wie static/chunks/....js)
          for R in 1 2; do
            grep -ohE '"(static|_next)/[A-Za-z0-9_./~-]+\.js"|https://[a-z0-9.-]*rbxcdn\.com/[A-Za-z0-9_./~-]+\.js' js/*.js | tr -d '"' | sort -u > more.txt
            while read -r S; do case "$S" in http*) URL=$S;; _next/*) URL="$BASE/$S";; *) URL="$BASE/_next/$S";; esac
              F=js/$(echo "$URL" | md5sum | cut -c1-12).js; [ -f "$F" ] || curl -sS "$URL" -o "$F"; done < more.txt
          done
          ls js | wc -l
          # Kontext rund um die Fragebogen-Endpunkte ausgeben (oeffentlicher Creator-Hub-Code, nichts Geheimes)
          for K in 'questionnaires/{universeId}/latest' 'questionnaires/{questionnaireId}' 'questionnaires/latest' 'questionnaires/status' 'questionnaires/additional' 'experience-questionnaire' 'questionnaire-api' 'questionnaireService' 'submitQuestionnaire' 'answers'; do
            echo "######## $K"
            grep -ohF -- "$K" js/*.js | head -1 >/dev/null
            for F in $(grep -lF -- "$K" js/*.js | head -3); do
              python3 -c "
          import sys,re
          s=open(sys.argv[1],errors='ignore').read(); k=sys.argv[2]
          for m in list(re.finditer(re.escape(k),s))[:4]:
              print('---',sys.argv[1],m.start()); print(s[max(0,m.start()-1500):m.start()+1500])
          " "$F" "$K"
            done
          done | head -c 400000
          # aktueller Fragebogen-Stand (Lesen)
          for B in experience-questionnaire-api experience-questionnaire questionnaire-api experience-questionnaire-service; do
            echo "== $B"; call GET "https://apis.roblox.com/$B/v1/questionnaires/$U/latest" | head -c 4000; echo
            call GET "https://apis.roblox.com/$B/v1/questionnaires/latest" | head -c 4000; echo
          done
          rm -f out/pages.html
      - uses: actions/upload-artifact@v4
        with:
          name: discover
          path: out/
