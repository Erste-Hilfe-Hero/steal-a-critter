name: Source language icon test

# Test am privaten Obby: Ausgangssprache kurz umstellen, Englisch als Uebersetzung hochladen,
# zuruekstellen und schauen, ob das englische Icon bleibt.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-n2q134]
    paths: [".github/workflows/media-source-test.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          set +e
          U=10772778395
          I18N=https://apis.roblox.com/legacy-game-internationalization/v1
          PUB=https://gameinternationalization.roblox.com/v1
          K="x-api-key: $ROBLOX_API_KEY"
          ICON=games/obby/assets/icon.png; TH=games/obby/assets/thumbnail.png
          note() { echo "::notice::$1: $(echo "$2" | tr -d '\n' | head -c 700)"; }
          state() {
            note "$1 source" "$(curl -sS $PUB/source-language/games/$U)"
            note "$1 icons" "$(curl -sS $PUB/game-icon/games/$U)"
            note "$1 thumbs" "$(curl -sS $PUB/game-thumbnails/games/$U/images | jq -c '[.data[]? | {l: .languageCode, n: (.mediaAssets | length)}]')"
            note "$1 public icon" "$(curl -sS "https://thumbnails.roblox.com/v1/games/icons?universeIds=$U&size=512x512&format=Png")"
            note "$1 media" "$(curl -sS https://games.roblox.com/v2/games/$U/media)"
          }
          state before
          for X in sq bs ka et; do
            R=$(curl -sS -X PATCH "$I18N/source-language/games/$U?languageCode=$X" -H "$K" -H 'Content-Length: 0' -w ' HTTP %{http_code}')
            note "source -> $X" "$R"
            [ "$(curl -sS $PUB/source-language/games/$U | jq -r .languageCode)" = "$X" ] && break
          done
          note "add en" "$(curl -sS -X PATCH "$I18N/supported-languages/games/$U" -H "$K" -H 'Content-Type: application/json' -d '[{"languageCodeType":"Language","languageCode":"en","delete":false}]' -w ' HTTP %{http_code}')"
          note "icon en" "$(curl -sS -X POST "$I18N/game-icon/games/$U/language-codes/en" -H "$K" -F "request.files=@$ICON;type=image/png" -w ' HTTP %{http_code}')"
          note "thumb en" "$(curl -sS -X POST "$I18N/game-thumbnails/games/$U/language-codes/en/image" -H "$K" -F "gameThumbnailRequest.files=@$TH;type=image/png" -w ' HTTP %{http_code}')"
          state switched
          note "source -> en" "$(curl -sS -X PATCH "$I18N/source-language/games/$U?languageCode=en" -H "$K" -H 'Content-Length: 0' -w ' HTTP %{http_code}')"
          sleep 30
          state after
