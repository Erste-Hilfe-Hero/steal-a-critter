name: Publish to Roblox

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      # Roblox' eigener Introspect-Endpunkt verraet, fuer welche Experiences der Schluessel gilt (der Schluessel selbst wird nicht ausgegeben)
      - name: Key scopes
        continue-on-error: true
        run: |
          curl -sS -X POST https://apis.roblox.com/api-keys/v1/introspect -H "Content-Type: application/json" \
            -d "{\"apiKey\":\"$ROBLOX_API_KEY\"}" -o introspect.json
          echo "::notice::key scopes: $(jq -c '{name, enabled, expired, scopes}' introspect.json 2>/dev/null || head -c 300 introspect.json)"

      # IDs aus roblox.json lesen. Fehlen sie, wird das neueste Spiel des Benutzers ueber oeffentliche APIs gesucht.
      - name: Resolve experience IDs
        run: |
          UNIVERSE_ID=$(jq -r '.universeId' roblox.json)
          PLACE_ID=$(jq -r '.placeId' roblox.json)
          USERNAME=$(jq -r '.username' roblox.json)
          if [ -z "$UNIVERSE_ID" ] && [ -f introspect.json ]; then
            UNIVERSE_ID=$(jq -r '[.scopes[]?.targetParts[]?] | map(select(. != "*")) | .[0] // empty' introspect.json)
            if [ -n "$UNIVERSE_ID" ]; then
              PLACE_ID=$(curl -sS "https://games.roblox.com/v1/games?universeIds=$UNIVERSE_ID" | jq -r '.data[0].rootPlaceId // empty')
              [ -z "$PLACE_ID" ] && PLACE_ID=$(curl -sS "https://develop.roblox.com/v1/universes/$UNIVERSE_ID" | jq -r '.rootPlaceId // empty')
            fi
          fi
          if [ -z "$PLACE_ID" ] && [ -n "$USERNAME" ]; then
            USER_ID=$(curl -sS -X POST https://users.roblox.com/v1/usernames/users -H "Content-Type: application/json" \
              -d "{\"usernames\":[\"$USERNAME\"],\"excludeBannedUsers\":true}" | jq -r '.data[0].id // empty')
            echo "User ID: $USER_ID"
            if [ -n "$USER_ID" ]; then
              curl -sS "https://games.roblox.com/v2/users/$USER_ID/games?accessFilter=2&limit=10&sortOrder=Desc" -o games.json
              jq '.data[] | {name, id, rootPlace: .rootPlace.id}' games.json || cat games.json
              echo "::notice::User $USER_ID games: $(jq -c '[.data[]? | {name, id, place: .rootPlace.id}]' games.json)"
              UNIVERSE_ID=$(jq -r '.data[0].id // empty' games.json)
              PLACE_ID=$(jq -r '.data[0].rootPlace.id // empty' games.json)
            fi
          fi
          if [ -n "$PLACE_ID" ] && [ -z "$UNIVERSE_ID" ]; then
            UNIVERSE_ID=$(curl -sS "https://apis.roblox.com/universes/v1/places/$PLACE_ID/universe" | jq -r '.universeId // empty')
          fi
          echo "::notice::Universe ID: '$UNIVERSE_ID' / Place ID: '$PLACE_ID' / API key set: $([ -n "$ROBLOX_API_KEY" ] && echo yes || echo no)"
          echo "UNIVERSE_ID=$UNIVERSE_ID" >> "$GITHUB_ENV"
          echo "PLACE_ID=$PLACE_ID" >> "$GITHUB_ENV"

      - name: Install Rojo
        run: |
          curl -sSL -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.4.4/rojo-7.4.4-linux-x86_64.zip
          unzip -q rojo.zip
          chmod +x rojo

      - name: Build place file
        run: ./rojo build default.project.json -o StealACritter.rbxlx

      - name: Upload place file
        uses: actions/upload-artifact@v4
        with:
          name: StealACritter
          path: StealACritter.rbxlx

      - name: Publish to Roblox
        if: env.ROBLOX_API_KEY != '' && env.UNIVERSE_ID != '' && env.PLACE_ID != ''
        run: |
          curl --fail-with-body -sS -X POST \
            "https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=Published" \
            -H "x-api-key: ${ROBLOX_API_KEY}" \
            -H "Content-Type: application/xml" \
            --data-binary @StealACritter.rbxlx -o publish.json
          echo "::notice::Published: $(cat publish.json)"
