name: Media check

# Nur lesen (oeffentliche Endpunkte, kein Key): was zeigt Roblox fuer Icon und Thumbnails an?
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-n2q134]
    paths: [".github/workflows/media-check.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check
        run: |
          set +e
          note() { echo "::notice::$1: $(echo "$2" | tr -d '\n' | head -c 1500)"; }
          for U in 3003317051 10772778395; do
            note "$U source" "$(curl -sS https://gameinternationalization.roblox.com/v1/source-language/games/$U)"
            note "$U media v2" "$(curl -sS https://games.roblox.com/v2/games/$U/media)"
            note "$U icon" "$(curl -sS "https://thumbnails.roblox.com/v1/games/icons?universeIds=$U&size=512x512&format=Png")"
            note "$U thumbs" "$(curl -sS "https://thumbnails.roblox.com/v1/games/multiget/thumbnails?universeIds=$U&size=768x432&format=Png&countPerUniverse=5")"
            note "$U i18n thumbs" "$(curl -sS https://gameinternationalization.roblox.com/v1/game-thumbnails/games/$U/images | jq -c '[.data[]? | {l: .languageCode, a: [.mediaAssets[]? | {id: .mediaAssetId, s: .state}]}] | .[:4]')"
            note "$U i18n raw" "$(curl -sS https://gameinternationalization.roblox.com/v1/game-thumbnails/games/$U/images | head -c 600)"
            for L in de-de en-us; do
              note "$U icon $L" "$(curl -sS -H "Accept-Language: $L" -H "Roblox-Locale: $L" "https://thumbnails.roblox.com/v1/games/icons?universeIds=$U&size=512x512&format=Png")"
            done
            note "$U details" "$(curl -sS "https://games.roblox.com/v1/games?universeIds=$U" | jq -c '.data[0] | {name, sourceName, isAllGenre, visits}')"
          done
